version: "3.8"

services:
  authority-navigation:
    # 在服务器上从源码本地构建，不再依赖镜像仓库
    build: .
    image: authority-navigation:local
    container_name: authority-navigation
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - WRITE_RATE_LIMIT_MAX=${WRITE_RATE_LIMIT_MAX:-50}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-6}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
    volumes:
      - ./data:/app/data
    networks:
      - authority-navigation-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: authority-navigation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/authority-navigation.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - authority-navigation
    networks:
      - authority-navigation-net

  certbot:
    image: certbot/certbot
    container_name: authority-navigation-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - authority-navigation-net

networks:
  authority-navigation-net:
    driver: bridge
