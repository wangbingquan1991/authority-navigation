<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="tiktok">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权威导航</title>
    <style id="theme-vars">
/* Authority Navigation custom styles */

:root {
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --tk-background: var(--background, #ffffff);
  --tk-foreground: var(--foreground, #0f172a);
  --tk-card: var(--card, var(--background));
  --tk-card-foreground: var(--card-foreground, var(--foreground));
  --tk-popover: var(--popover, var(--card));
  --tk-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --tk-primary: var(--primary, #111827);
  --tk-primary-foreground: var(--primary-foreground, #ffffff);
  --tk-secondary: var(--secondary, var(--muted, var(--card)));
  --tk-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --tk-muted: var(--muted, var(--card));
  --tk-muted-foreground: var(--muted-foreground, var(--foreground));
  --tk-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --tk-accent-foreground: var(--accent-foreground, var(--foreground));
  --tk-destructive: var(--destructive, #ef4444);
  --tk-destructive-foreground: var(--destructive-foreground, #ffffff);
  --tk-border: var(--border, currentColor);
  --tk-input: var(--input, var(--border));
  --tk-ring: var(--ring, var(--primary));
  --tk-chart-1: var(--chart-1, var(--primary));
  --tk-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --tk-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --tk-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --tk-chart-5: var(--chart-5, var(--foreground));
  --tk-sidebar: var(--sidebar, var(--background));
  --tk-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --tk-sidebar-primary: var(--sidebar-primary, var(--primary));
  --tk-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --tk-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --tk-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

  /* Brand colors */
  /* tk-red scale */
  --tk-red-100: #FFE9EE;
  --tk-red-200: #FFC9D5;
  --tk-red-300: #FFA0B5;
  --tk-red-400: #FF6485;
  --tk-red-500: #FE2C55;
  --tk-red-600: #E61E45;
  --tk-red-700: #C01338;
  --tk-red-800: #990C2B;
  --tk-red-900: #6B061D;
  --tk-red-1000: #3D0210;

  /* tk-cyan scale */
  --tk-cyan-100: #E3FEFD;
  --tk-cyan-200: #BAFCFA;
  --tk-cyan-300: #7CF8F4;
  --tk-cyan-400: #25F4EE;
  --tk-cyan-500: #14D6D0;
  --tk-cyan-600: #0FB3AE;
  --tk-cyan-700: #0C8F8B;
  --tk-cyan-800: #086B68;
  --tk-cyan-900: #054745;
  --tk-cyan-1000: #022322;

  /* tk-black scale */
  --tk-black-100: #EBEBED;
  --tk-black-200: #D2D3D7;
  --tk-black-300: #ABACB4;
  --tk-black-400: #84868F;
  --tk-black-500: #5D5F6B;
  --tk-black-600: #44454F;
  --tk-black-700: #313340;
  --tk-black-800: #232533;
  --tk-black-900: #1B1D29;
  --tk-black-1000: #161823;

  /* tk-white scale */
  --tk-white-100: #FFFFFF;
  --tk-white-200: #FAFAFB;
  --tk-white-300: #F2F2F4;
  --tk-white-400: #E8E8EC;
  --tk-white-500: #DCDCE2;
  --tk-white-600: #C9C9D1;
  --tk-white-700: #ABABB5;
  --tk-white-800: #87878F;
  --tk-white-900: #5E5E66;
  --tk-white-1000: #36363B;

  /* Brand */
  --primary: #FE2C55;
  --secondary: #25F4EE;

  /* Surface */
  --background: #0B0B10;
  --card: #161823;
  --card-elevated: #1C1E2A;
  --video-bg: #16161C;
  --muted: #1C1E2A;

  /* Content */
  --foreground: #F5F5F7;
  --muted-foreground: #AEB2C0;
  --on-media: #FFFFFF;
  --on-accent: #161823;

  /* Border */
  --border: #3A3D52;

  /* Radius */
  --radius-xs: 2px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-shell: 32px;
  --radius-pill: 999px;

  /* Success */
  --success: #10B981;
  --success-bg: #0E2A22;
  --success-fg: #34D399;

  /* Error */
  --destructive: #E5484D;
  --error-bg: #2E1416;
  --error-fg: #FF6485;

  /* Type families */
  --font-display: Inter, "TikTok Display", ui-sans-serif, sans-serif;
  --font-sans: Inter, "TikTok Sans", ui-sans-serif, sans-serif;
  --font-serif: Georgia, Times, serif;
  --font-mono: "JetBrains Mono", monospace;

  /* Type metrics */
  --display-size: clamp(48px, 7vw, 96px);
  --display-weight: 600-700;
  --display-line-height: 0.95;
  --display-letter-spacing: -0.02em;
  --h2-size: 28-32;
  --h2-weight: 600;
  --h2-line-height: 1.15;
  --h3-size: 18-20;
  --h3-weight: 600;
  --h3-line-height: 1.3;
  --body-size: 14-15;
  --body-weight: 400;
  --body-line-height: 1.6;
  --kicker-size: 11;
  --kicker-weight: 400;
  --kicker-letter-spacing: 0.14em;
  --kicker-text-transform: uppercase;

  /* Component aliases used by page styles */
  --tk-bg: #0B0B10;
  --tk-text: #F5F5F7;
  --tk-text-secondary: #AEB2C0;
  --tk-text-tertiary: #87878F;
  --tk-surface: #161823;
  --tk-surface-hover: #1C1E2A;
  --tk-surface-elevated: #1C1E2A;
  --tk-primary: #FE2C55;
  --tk-secondary: #25F4EE;
  --tk-secondary-subtle: rgba(37, 244, 238, 0.12);
  --tk-secondary-hover: rgba(37, 244, 238, 0.22);
  --tk-glow-primary: rgba(254, 44, 85, 0.35);
  --tk-glow-secondary: rgba(37, 244, 238, 0.25);
  --tk-shadow: rgba(0, 0, 0, 0.45);
  --tk-danger-bg: rgba(254, 44, 85, 0.15);
  --tk-modal-overlay: rgba(11, 11, 16, 0.85);
  --tk-modal-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);

  /* 顶栏统一高度 */
  --tk-bar-height: 44px;
}

  --foreground: #3d3929;
  --card: #ffffff;
  --card-foreground: #3d3929;

  --muted-foreground: #6f6b5e;
  --border: #e6e4dc;
  --primary: #c96442;
  --primary-foreground: #ffffff;
  --secondary: #d97757;
  --secondary-foreground: #ffffff;
  --accent: #d97757;
  --accent-foreground: #ffffff;
  --destructive: #c96442;
  --destructive-foreground: #ffffff;

  --tk-bg: #faf9f5;
  --tk-text: #3d3929;
  --tk-text-secondary: #6f6b5e;
  --tk-text-tertiary: #908c7c;
  --tk-surface: #ffffff;
  --tk-surface-hover: #f5f4ef;
  --tk-surface-elevated: #ffffff;
  --tk-border: #e6e4dc;
  --tk-primary: #c96442;
  --tk-secondary: #d97757;
  --tk-secondary-subtle: rgba(201, 100, 66, 0.10);
  --tk-secondary-hover: rgba(201, 100, 66, 0.18);

  --tk-modal-overlay: rgba(61, 57, 41, 0.45);

  --accent-foreground: #262624;
  --destructive: #e08d70;
  --destructive-foreground: #262624;

  --tk-bg: #262624;
  --tk-text: #f1f1ef;

  --tk-text-tertiary: #8a877d;
  --tk-surface: #2e2e2b;
  --tk-surface-hover: #3a3a36;
  --tk-surface-elevated: #363632;
  --tk-border: #4a4945;
  --tk-primary: #d97757;
  --tk-secondary: #e08d70;
  --tk-secondary-subtle: rgba(217, 119, 87, 0.15);
  --tk-secondary-hover: rgba(217, 119, 87, 0.25);

  --tk-surface: #ffffff;
  --tk-surface-hover: #f7f7fa;

  --tk-secondary-subtle: rgba(0, 122, 255, 0.10);
  --tk-secondary-hover: rgba(0, 122, 255, 0.18);
  --tk-glow-primary: rgba(0, 122, 255, 0.25);

  --tk-danger-bg: rgba(255, 59, 48, 0.12);
  --tk-modal-overlay: rgba(0, 0, 0, 0.35);

[data-theme="apple-dark"] {
  --background: #000000;
  --foreground: #f5f5f7;
  --card: #1c1c1e;
  --card-foreground: #f5f5f7;
  --muted: #1c1c1e;
  --muted-foreground: #8e8e93;
  --border: #3a3a3c;
  --primary: #2e8dff;
  --primary-foreground: #000000;
  --secondary: #1c1c1e;
  --secondary-foreground: #f5f5f7;
  --accent: #2c2c2e;
  --accent-foreground: #f5f5f7;
  --destructive: #ff453a;
  --destructive-foreground: #000000;

  --tk-bg: #000000;
  --tk-text: #f5f5f7;
  --tk-text-secondary: #aeaeb2;
  --tk-text-tertiary: #8e8e93;
  --tk-surface: #1c1c1e;
  --tk-surface-hover: #2c2c2e;
  --tk-surface-elevated: #2c2c2e;
  --tk-border: #3a3a3c;
  --tk-primary: #2e8dff;
  --tk-secondary: #30d158;
  --tk-secondary-subtle: rgba(46, 141, 255, 0.15);
  --tk-secondary-hover: rgba(46, 141, 255, 0.25);
  --tk-glow-primary: rgba(46, 141, 255, 0.35);
  --tk-glow-secondary: rgba(48, 209, 88, 0.25);
  --tk-shadow: rgba(0, 0, 0, 0.45);
  --tk-danger-bg: rgba(255, 69, 58, 0.15);
  --tk-modal-overlay: rgba(0, 0, 0, 0.75);
  --tk-modal-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);

:root {
  --tk-radius-sm: 8px;
  --tk-radius-md: 14px;
  --tk-radius-lg: 22px;
  --tk-radius-pill: 999px;
  --tk-space-xs: 8px;
  --tk-space-sm: 12px;
  --tk-space-md: 16px;
  --tk-space-lg: 24px;
  --tk-space-xl: 40px;
  --tk-transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  --tk-font-sans: Inter, "TikTok Sans", ui-sans-serif, sans-serif;
  /* 卡片统一高度：链接区高度决定分类卡片高度，新建分类卡片取同值，保证整行等高 */
  --tk-links-h: 210px;
  --tk-card-h: 315px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--tk-font-sans);
  background: var(--tk-bg);
  color: var(--tk-text);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 18%, var(--tk-glow-primary), transparent 28%),
    radial-gradient(circle at 88% 82%, var(--tk-glow-secondary), transparent 28%);
  opacity: 0.45;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: min(1180px, calc(100% - var(--tk-space-lg) * 2));
  margin-inline: auto;
  padding-block: var(--tk-space-xl);
}

header {
  display: flex;
  flex-direction: column;
  gap: var(--tk-space-lg);
  margin-bottom: var(--tk-space-xl);
}

/* 单行顶栏：品牌 | 搜索（占最宽） | 主题切换 | 数据管理 */
.top-bar {
  display: flex;
  align-items: center;
  gap: var(--tk-space-md);
  flex-wrap: nowrap;
}

/* 顶栏统一风格：品牌 / 主题切换 / 数据管理共用同一套胶囊容器，与搜索框等高 */
.nav-header-content,
.theme-switcher,
.icon-btn-group {
  display: inline-flex;
  align-items: center;
  height: var(--tk-bar-height);
  background: var(--tk-surface);
  border: 1px solid var(--tk-border);
  border-radius: var(--tk-radius-pill);
  flex: 0 0 auto;
}

.nav-header-content {
  padding: 0 var(--tk-space-md) 0 6px;
  min-width: 0;
}

/* 主题切换的按钮组已在外层 .theme-switcher 上成胶囊，内层去掉重复的边框与底色 */
.theme-switcher .icon-btn-group {
  height: auto;
  padding: 0;
  background: transparent;
  border: none;
  border-radius: 0;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--tk-space-sm);
  white-space: nowrap;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 18px var(--tk-glow-primary);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

h1 {
  font-size: clamp(1rem, 1.6vw, 1.15rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, var(--tk-text) 0%, var(--tk-text-secondary) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap;
}

.search-wrap {
  position: relative;
  flex: 1 1 auto;
  min-width: 180px;
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--tk-text-tertiary);
  pointer-events: none;
}

#search {
  width: 100%;
  height: var(--tk-bar-height);
  padding: 0 20px 0 44px;
  font-size: 0.95rem;
  font-family: inherit;
  color: var(--tk-text);
  background: var(--tk-surface);
  border: 1px solid var(--tk-border);
  border-radius: var(--tk-radius-pill);
  outline: none;
  transition: border-color var(--tk-transition), box-shadow var(--tk-transition);
}

#search::placeholder {
  color: var(--tk-text-tertiary);
}

#search:focus {
  border-color: var(--tk-primary);
  box-shadow: 0 0 0 4px var(--tk-glow-primary);
}

/* 结果计数悬浮在搜索框下方，避免撑高单行顶栏 */
.result-count {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--tk-text-secondary);
  font-size: 0.8rem;
  margin-top: 6px;
  min-height: 1.2em;
  pointer-events: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--tk-space-lg);
  align-items: start;
}

.card {
  background: var(--tk-surface);
  border: 1px solid var(--tk-border);
  border-radius: var(--tk-radius-md);
  padding: var(--tk-space-lg);
  transition: transform var(--tk-transition), border-color var(--tk-transition), box-shadow var(--tk-transition), opacity var(--tk-transition);
  display: flex;
  flex-direction: column;
  gap: var(--tk-space-md);
  cursor: grab;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--tk-glow-primary);
  box-shadow: 0 12px 32px var(--tk-shadow), 0 0 0 1px var(--tk-glow-primary);
}

.card.dragging {
  opacity: 0.5;
  transform: scale(0.98);
  box-shadow: 0 20px 40px var(--tk-shadow);
  cursor: grabbing;
}

.card.drag-over {
  border-color: var(--tk-primary);
  box-shadow: 0 0 0 2px var(--tk-glow-primary), 0 12px 32px var(--tk-shadow);
}

.card.link-drag-over {
  border-color: var(--tk-secondary);
  box-shadow: 0 0 0 2px var(--tk-glow-secondary), 0 12px 32px var(--tk-shadow);
}

/* 链接项可拖动 */
.links li {
  cursor: grab;
}

.links li.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

/* ============================================================
   快捷入口：按使用频率排序的跨分类快捷栏
   ============================================================
   刻意不使用卡片外壳（无背景面 / 无边框 / 无内边距 / 无圆角），
   也不使用分类图标与分类级标题。它不是一个分类，因此不能在视觉上
   与下方的分类卡片同构，否则会被读成「又一个分类」。 */
.quick-access {
  margin-bottom: var(--tk-space-xl);
}

.quick-access-head {
  display: flex;
  align-items: center;
  gap: var(--tk-space-sm);
  margin-bottom: var(--tk-space-xs);
}

.quick-access-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--tk-text);
  letter-spacing: 0.02em;
}

.quick-access-hint {
  font-size: 0.72rem;
  color: var(--tk-text-tertiary);
}

.quick-access-add {
  margin-left: auto;
  padding: 4px 12px;
  border: 1px solid var(--tk-border);
  border-radius: var(--tk-radius-pill);
  background: transparent;
  color: var(--tk-text-secondary);
  font-family: inherit;
  font-size: 0.76rem;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
  transition: background var(--tk-transition), color var(--tk-transition), border-color var(--tk-transition);
}

.quick-access-add:hover {
  background: var(--tk-secondary-subtle);
  color: var(--tk-secondary);
  border-color: var(--tk-secondary);
}

.quick-access-list {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--tk-space-xs);
}

.quick-access-item {
  display: inline-flex;
  align-items: center;
  cursor: grab;
}

.quick-access-item.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

.quick-chip {
  display: inline-block;
  max-width: 15em;
  overflow: hidden;
  padding: 6px 12px;
  border: 1px solid var(--tk-border);
  border-radius: var(--tk-radius-pill);
  background: var(--tk-surface);
  color: var(--tk-text-secondary);
  font-size: 0.82rem;
  text-decoration: none;
  white-space: nowrap;
  text-overflow: ellipsis;
  transition: background var(--tk-transition), color var(--tk-transition), border-color var(--tk-transition);
}

.quick-chip:hover {
  background: var(--tk-surface-hover);
  color: var(--tk-text);
  border-color: var(--tk-secondary);
}

/* 移出按钮默认收起，悬停或键盘聚焦时展开，保持横条整洁 */
.quick-chip-remove {
  width: 0;
  padding: 0;
